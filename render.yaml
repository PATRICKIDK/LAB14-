services:
  - type: web
    name: lab14pm
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: lab14pm-db
          property: connectionString

databases:
  - name: lab14pm-db
    databaseName: lab14pm
    user: lab14pm_user
    plan: free
